<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cat Gif of the Day</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>" />
    <style>
      :root {
        --bg: #f6f1ea;
        --card: #ffffff;
        --text: #2b2521;
        --muted: #8a7f76;
        --accent: #e07a5f;
        --accent-hover: #c9654b;
        --shadow: 0 20px 50px rgba(60, 40, 20, 0.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1c1917;
          --card: #292524;
          --text: #f5f0eb;
          --muted: #a8a29e;
          --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 520px;
        background: var(--card);
        border-radius: 24px;
        padding: 28px;
        box-shadow: var(--shadow);
        text-align: center;
      }
      .eyebrow {
        margin: 0;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 6px 0 22px;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      .frame {
        border-radius: 16px;
        overflow: hidden;
        background: var(--bg);
        aspect-ratio: 4 / 3;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .button {
        display: inline-block;
        margin-top: 22px;
        padding: 12px 26px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
        transition: background 0.2s, transform 0.2s;
      }
      .button:hover {
        background: var(--accent-hover);
        transform: translateY(-1px);
      }
      footer {
        margin-top: 18px;
        font-size: 13px;
        color: var(--muted);
      }
      footer a {
        color: inherit;
      }
      .version {
        margin-top: 8px;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">Catnip</p>
      <h1>Cat Gif of the Day, última clase gestión, suerte</h1>
      <div class="frame">
        <img src="{{url}}" alt="A random cat gif" onerror="this.onerror=null; this.src='{{fallback}}';" />
      </div>
      <a class="button" href="/">Show me another cat</a>
      <footer>
        Courtesy of <a href="https://cataas.com">Cataas</a> &amp;
        <a href="http://www.buzzfeed.com/copyranter/the-best-cat-gif-post-in-the-history-of-cat-gifs">Buzzfeed</a>
        <div class="version">Versión: <code>{{version}}</code></div>
      </footer>
    </main>
  </body>
</html>
